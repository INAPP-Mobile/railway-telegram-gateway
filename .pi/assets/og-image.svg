<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="50%" stop-color="#2d1b69"/>
      <stop offset="100%" stop-color="#11998e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Paper plane icon -->
  <g transform="translate(600, 280)" fill="white" opacity="0.15">
    <path d="M0,0 L-180,-80 L-40,-20 Z"/>
    <path d="M0,0 L-180,80 L-40,20 Z"/>
    <path d="M0,0 L-40,-20 L-100,0 L-40,20 Z"/>
    <path d="M-40,-20 L100,-60 L0,0 Z"/>
    <path d="M-40,20 L100,60 L0,0 Z"/>
  </g>

  <!-- Title -->
  <text x="600" y="340" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="700" fill="white">Railway Telegram Gateway</text>
  
  <!-- Subtitle -->
  <text x="600" y="395" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" fill="rgba(255,255,255,0.7)">Multi-bot webhook → WebSocket gateway</text>

  <!-- Tags -->
  <g transform="translate(600, 460)" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16">
    <rect x="-100" y="-18" width="200" height="36" rx="18" fill="rgba(255,255,255,0.1)"/>
    <text x="0" y="7" fill="rgba(255,255,255,0.9)">Telegram · WebSocket · Node.js</text>
  </g>
</svg>
