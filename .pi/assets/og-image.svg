<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0088cc"/>
      <stop offset="100%" style="stop-color:#4fc3f7"/>
    </linearGradient>
    <linearGradient id="ws-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c4dff"/>
      <stop offset="100%" style="stop-color:#651fff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" rx="0"/>

  <!-- Grid pattern overlay -->
  <g opacity="0.04">
    <line x1="0" y1="0" x2="0" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="60" y1="0" x2="60" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="120" y1="0" x2="120" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="180" y1="0" x2="180" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="240" y1="0" x2="240" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="360" y1="0" x2="360" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="420" y1="0" x2="420" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="480" y1="0" x2="480" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="540" y1="0" x2="540" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="660" y1="0" x2="660" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="720" y1="0" x2="720" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="780" y1="0" x2="780" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="840" y1="0" x2="840" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="960" y1="0" x2="960" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="1020" y1="0" x2="1020" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="1080" y1="0" x2="1080" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="1140" y1="0" x2="1140" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="63" x2="1200" y2="63" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="126" x2="1200" y2="126" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="189" x2="1200" y2="189" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="252" x2="1200" y2="252" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="378" x2="1200" y2="378" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="441" x2="1200" y2="441" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="504" x2="1200" y2="504" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="567" x2="1200" y2="567" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="630" x2="1200" y2="630" stroke="#fff" stroke-width="0.5"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="1050" cy="100" r="180" fill="none" stroke="url(#accent)" stroke-width="0.5" opacity="0.15"/>
  <circle cx="1050" cy="100" r="250" fill="none" stroke="url(#accent)" stroke-width="0.5" opacity="0.08"/>
  <circle cx="150" cy="530" r="140" fill="none" stroke="url(#ws-glow)" stroke-width="0.5" opacity="0.1"/>

  <!-- Telegram Paper Plane Icon (simplified) -->
  <g transform="translate(80, 80)" filter="url(#soft-glow)">
    <g transform="translate(0, 10)">
      <path d="M0 0 L140 280 L60 240 L0 300 Z" fill="url(#accent)" opacity="0.9"/>
      <path d="M0 0 L140 280 L0 180 Z" fill="#4fc3f7" opacity="0.6"/>
    </g>
  </g>

  <!-- WebSocket Node visualization -->
  <g transform="translate(720, 160)">
    <!-- Central hub -->
    <circle cx="200" cy="100" r="35" fill="url(#ws-glow)" opacity="0.2" filter="url(#glow)"/>
    <circle cx="200" cy="100" r="20" fill="url(#ws-glow)" opacity="0.4"/>
    <circle cx="200" cy="100" r="10" fill="#7c4dff"/>

    <!-- Bot nodes -->
    <circle cx="80" cy="40" r="8" fill="#0088cc" opacity="0.7"/>
    <circle cx="320" cy="40" r="8" fill="#0088cc" opacity="0.7"/>
    <circle cx="80" cy="160" r="8" fill="#0088cc" opacity="0.7"/>
    <circle cx="320" cy="160" r="8" fill="#0088cc" opacity="0.7"/>
    <circle cx="200" cy="180" r="6" fill="#4fc3f7" opacity="0.5"/>

    <!-- Connection lines -->
    <g stroke="#7c4dff" stroke-width="1.5" opacity="0.5" fill="none">
      <path d="M80 40 Q 140 70 190 95"/>
      <path d="M320 40 Q 260 70 210 95"/>
      <path d="M80 160 Q 140 130 190 105"/>
      <path d="M320 160 Q 260 130 210 105"/>
      <path d="M200 180 Q 200 140 200 120"/>
    </g>

    <!-- Animated data pulse dots -->
    <circle cx="130" cy="55" r="3" fill="#4fc3f7" opacity="0.8"/>
    <circle cx="170" cy="80" r="2" fill="#4fc3f7" opacity="0.6"/>
    <circle cx="260" cy="80" r="2" fill="#4fc3f7" opacity="0.6"/>
    <circle cx="280" cy="55" r="3" fill="#4fc3f7" opacity="0.8"/>
    <circle cx="130" cy="145" r="2" fill="#4fc3f7" opacity="0.6"/>
    <circle cx="170" cy="120" r="2" fill="#4fc3f7" opacity="0.5"/>
    <circle cx="260" cy="120" r="2" fill="#4fc3f7" opacity="0.5"/>
    <circle cx="280" cy="145" r="2" fill="#4fc3f7" opacity="0.6"/>
  </g>

  <!-- Title -->
  <text x="80" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-1">railway-telegram-gateway</text>

  <!-- Tagline -->
  <text x="80" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#90caf9" letter-spacing="0">
    Multi-bot Telegram webhook gateway
  </text>
  <text x="80" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#90caf9" letter-spacing="0">
    with real-time WebSocket event streaming
  </text>

  <!-- Feature pills -->
  <g transform="translate(80, 520)">
    <rect x="0" y="0" width="100" height="32" rx="16" fill="#0088cc" opacity="0.25"/>
    <text x="50" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#4fc3f7" text-anchor="middle">Multi-Bot</text>

    <rect x="115" y="0" width="120" height="32" rx="16" fill="#7c4dff" opacity="0.25"/>
    <text x="175" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#b388ff" text-anchor="middle">WebSocket</text>

    <rect x="250" y="0" width="100" height="32" rx="16" fill="#00bfa5" opacity="0.2"/>
    <text x="300" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#69f0ae" text-anchor="middle">Real-Time</text>

    <rect x="365" y="0" width="110" height="32" rx="16" fill="#ff6d00" opacity="0.2"/>
    <text x="420" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#ffab40" text-anchor="middle">TypeScript</text>
  </g>

  <!-- Bottom bar -->
  <rect x="80" y="585" width="320" height="1" fill="#ffffff" opacity="0.1"/>
  <text x="80" y="610" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#64748b">
    INAPP / railway-telegram-gateway
  </text>
</svg>
