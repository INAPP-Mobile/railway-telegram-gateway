<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="plane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0088cc"/>
      <stop offset="100%" style="stop-color:#4fc3f7"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0088cc"/>
      <stop offset="50%" style="stop-color:#4fc3f7"/>
      <stop offset="100%" style="stop-color:#0088cc"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative subtle circles -->
  <circle cx="1000" cy="80" r="300" fill="none" stroke="#4fc3f7" stroke-width="0.5" opacity="0.06"/>
  <circle cx="200" cy="550" r="200" fill="none" stroke="#0088cc" stroke-width="0.5" opacity="0.05"/>

  <!-- Telegram Paper Plane - Large, clean, centered icon -->
  <g transform="translate(120, 175)">
    <circle cx="120" cy="140" r="130" fill="none" stroke="url(#plane)" stroke-width="2" opacity="0.15"/>
    <g filter="url(#glow)">
      <path d="M40 140 L180 30 L200 260 L120 210 Z" fill="url(#plane)" opacity="0.95"/>
      <path d="M40 140 L180 30 L120 210 Z" fill="#4fc3f7" opacity="0.5"/>
    </g>
  </g>

  <!-- Accent line -->
  <rect x="420" y="250" width="80" height="4" rx="2" fill="url(#accent-line)"/>

  <!-- Title -->
  <text x="420" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="-0.5">
    railway-telegram-gateway
  </text>

  <!-- Tagline -->
  <text x="420" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#90caf9">
    Multi-bot Telegram webhook gateway
  </text>
  <text x="420" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#90caf9">
    with real-time WebSocket event streaming
  </text>

  <!-- Bottom: repo path -->
  <rect x="420" y="420" width="400" height="1" fill="#ffffff" opacity="0.08"/>
  <text x="420" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569">
    github.com/INAPP-Mobile/railway-telegram-gateway
  </text>
</svg>
